ebogen:</strong> Wer den neuen Bundeswehr-Fragebogen nicht ausfüllt, muss künftig 250 Euro Bußgeld zahlen – die Maßnahme sorgt für Diskussionen über Verhältnismäßigkeit.</li>\n  <li><strong>B.Z. & Springer:</strong> Axel Springer plant, die Boulevardzeitung <em>B.Z.</em> künftig von Journalistenschülerinnen und -schülern produzieren zu lassen – ein ungewöhnliches Modell mit unklaren Qualitätsaussichten.</li>\n  <li><strong>Singapur:</strong> Die Stadt-Staat führt Stockhiebe als Strafe für Schulbullying ein – international umstrittene Reaktion auf ein wachsendes Problem.</li>\n  <li><strong>Antisemitismus in London:</strong> Die NZZ thematisiert das Ausbleiben öffentlicher Proteste nach antisemitischen Messerattacken – ein Kommentar zur Selektivität im antirassistischen Diskurs.</li>\n  <li><strong>Hantavirus auf Kreuzfahrtschiff:</strong> Dutzende Passagiere verließen das Schiff auf St. Helena; die Behörden suchen nach weiteren Betroffenen.</li>\n</ul>\n\n<hr>\n\n<h2>📅 Ausblick</h2>\n\n<p>Die Augen der Märkte und der Diplomatie richten sich heute auf die weiteren Entwicklungen im Iran-Verhandlungsprozess – ein belastbares Abkommen könnte die Energiemärkte nachhaltig verschieben und geopolitische Risikobewertungen neu kalibrieren. Innenpolitisch dürfte die deutsche Steuerschätzdebatte die Koalitionsgespräche in Berlin weiter belasten.</p><details class=\"src-details\"><summary class=\"src-summary\"><span class=\"src-arrow\">▶</span>📰 Quellen &amp; Schlagzeilen (60 Artikel)</summary><div class=\"src-body\"><div class=\"src-category\"><div class=\"src-category-name\">Produktstrategie & Tech</div><div class=\"src-source\"><div class=\"src-source-name\">Stratechery</div><div class=\"src-item\"><a href=\"https://stratechery.com/2026/an-interview-with-joanna-stern-about-living-with-ai/\" target=\"_blank\" class=\"src-link\">An Interview with Joanna Stern About Living With AI</a><span class=\"src-date\">07.05.2026, 10:00</span></div><div class=\"src-item\"><a href=\"https:/     "html": "<h1>🗞️ Morgen-Briefing – Mittwoch, 6. Mai 2026</h1>\n\n<hr>\n\n<h2>Einleitung</h2>\n\n<p>Die internationale Nachrichtenlage wird heute von Friedenshoffnungen im Nahen Osten dominiert – Berichten zufolge stehen die USA und Iran kurz vor einer Einigung. Gleichzeitig setzt die Tech-Branche ihre intensive Auseinandersetzung mit KI-Strategie und Unternehmenspositionierung fort, während an den deutschen Märkten verhaltener Optimismus herrscht.</p>\n\n<hr>\n\n<h2>🌍 Geopolitik & Sicherheit</h2>\n\n<ul>\n  <li><strong>Iran-USA-Annäherung:</strong> Washington und Teheran sollen kurz vor einer Vereinbarung zur Beendigung der Kampfhandlungen stehen – Teheran prüft einen US-Friedensvorschlag aktiv. China unterstützt die Bemühungen und drängt Iran zu einem dauerhaften Waffenstillstand.</li>\n  <li><strong>Ölpreis unter Druck:</strong> Friedenshoffnungen im Nahen Osten haben den Ölpreis zeitweise unter die Marke von 100 Dollar gedrückt – ein Signal, wie eng Geopolitik und Energiemärkte verzahnt bleiben.</li>\n  <li><strong>Ukraine-Konflikt:</strong> Kiew wirft Russland trotz vereinbarter Waffenruhe weitere Verletzungen vor; die Lage bleibt laut Live-Ticker angespannt.</li>\n  <li><strong>Europa & Verteidigung:</strong> Die Frage, ob Europa eigene Alternativen zu US-Marschflugkörpern wie dem Tomahawk entwickeln kann, gewinnt sicherheitspolitisch an Dringlichkeit.</li>\n  <li><strong>EU-Reform:</strong> Außenminister Wadephul plädiert für ein „Kern-Europa\" – ein Signal für eine mögliche Neuausrichtung der europäischen Integrationsdebatte.</li>\n</ul>\n\n<hr>\n\n<h2>💹 Finanzmärkte & Wirtschaft</h2>\n\n<ul>\n  <li><strong>DAX im Plus:</strong> Der deutsche Leitindex legte mehr als zwei Prozent zu – getragen von den Hoffnungen auf eine Friedenslösung im Nahen Osten und sinkenden Energiepreisen.</li>\n  <li><strong>Bayer wagt Milliarden-Zukauf:</strong> Erstmals seit Jahren plant Bayer wieder eine große Übernahme im Pharmasektor – ein Zeichen für wiedergewonnenes Investitionsvertrauen.</li>\n  <li><strong>Infineon hebt Prognose an:</strong> Der Halbleiterkonzern verspricht starkes Wachstum und sendet damit ein positives Signal für den deutschen Technologiesektor.</li>\n  <li><strong>Bitcoin unter Beobachtung:</strong> Starinvestor Michael Saylor erwägt erstmals einen Bitcoin-Verkauf – ein ungewöhnliches Signal vom prominentesten Krypto-Bullen der Branche.</li>\n  <li><strong>Deutsche Autoindustrie in der Krise:</strong> Teure Fahrzeuge bei schrumpfenden Margen – das Handelsblatt analysiert die strukturellen Ursachen der anhaltenden Automobil-Malaise in Deutschland.</li>\n</ul>\n\n<hr>\n\n<h2>🤖 Technologie & KI</h2>\n\n<ul>\n  <li><strong>Big-Tech-Earnings im Fokus:</strong> Microsoft, Apple, Amazon, Google, Meta und Intel haben ihre Quartalszahlen vorgelegt – Stratechery analysiert intensiv Geschäftsmodell-Resilienz und KI-Positionierung der Konzerne.</li>\n  <li><strong>DeepSeek nähert sich 45-Milliarden-Dollar-Bewertung:</strong> Das chinesische KI-Start-up wächst rasant und festigt Chinas Ambitionen als globaler KI-Akteur.</li>\n  <li><strong>SpaceX plant Chipfabrik-Investition:</strong> Elon Musks Raumfahrtunternehmen erwägt laut Spiegel eine gigantische Investition in Halbleiterfertigung – ein weiterer Schritt zur vertikalen Integration.</li>\n  <li><strong>KI verändert Produktstrategie:</strong> Lenny's Newsletter beleuchtet, warum klassische SaaS-Freemium-Modelle im KI-Zeitalter versagen und welche neuen Adoptionsstrategien Unternehmen wie Sendbird und Stripe erproben.</li>\n  <li><strong>Agentic AI im Aufwind:</strong> Interviews mit OpenAI-CEO Sam Altman, AWS-Chef Matt Garman und Google-Cloud-CEO Thomas Kurian unterstreichen: Autonome KI-Agenten stehen im Zentrum der nächsten Entwicklungswelle.</li>\n</ul>\n\n<hr>\n\n<h2>🏥 Gesellschaft & Gesundheit</h2>\n\n<ul>\n  <li><strong>Bildungskrise in Deutschland:</strong> Fast 2,8 Millionen junge Erwachsene bleiben ohne Berufsabschluss – der neue Berufsbildungsbericht zeichnet ein alarmierendes Bild.</li>\n  <li><strong>GKV-Reform trifft Gutverdiener hart:</strong> Die geplante Reform der gesetzlichen Krankenversicherung wird von Kritikern als „Sondersteuer für Fachkräfte\" bezeichnet – mit potenziellen Auswirkungen auf die Arbeitskräftegewinnung.</li>\n  <li><strong>Hantavirus auf Kreuzfahrtschiff:</strong> Ein Patient wird laut NZZ im Universitätsspital Zürich behandelt – Behörden beobachten den Fall aufmerksam.</li>\n  <li><strong>Thomas-Mann-Preis:</strong> Der israelische Autor David Grossman erhält die renommierte Auszeichnung – eine kulturelle Geste mit symbolischer Strahlkraft in angespannten Zeiten.</li>\n</ul>\n\n<hr>\n\n<h2>📅 Ausblick</h2>\n\n<p>Die weiteren Entwicklungen in den Iran-USA-Verhandlungen dürften den Ölpreis und die globalen Märkte in den kommenden Tagen maßgeblich bewegen. Gleichzeitig werden die laufenden Big-Tech-Quartalsberichte und die weitere KI-Strategiedebatte die Agenda in Wirtschaft und Technologie dominieren.</p>"

const today = new Date().toISOString().slice(0, 10);
const nav = document.getElementById("nav");
const content = document.getElementById("content");

document.getElementById("count-label").textContent =
  briefings.length + " Ausgabe" + (briefings.length !== 1 ? "n" : "");

briefings.forEach((b, i) => {
  // Nav item
  const item = document.createElement("div");
  item.className = "nav-item";
  item.dataset.id = b.id;
  const isToday = b.date === today;
  item.innerHTML = `
    <div class="nav-date">
      <div class="nav-weekday">${b.weekday}</div>
      <div class="nav-datestr">${b.date_display}</div>
    </div>
    ${isToday ? '<span class="today-badge">Heute</span>' : ""}
  `;
  item.addEventListener("click", () => show(b.id));
  nav.appendChild(item);

  // Content panel
  const panel = document.createElement("div");
  panel.className = "briefing";
  panel.id = "briefing-" + b.id;
  panel.innerHTML = `<div class="briefing-card">${b.html}</div>`;
  content.appendChild(panel);
});

function show(id) {
  document.querySelectorAll(".briefing").forEach(el => el.classList.remove("visible"));
  document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
  document.getElementById("briefing-" + id)?.classList.add("visible");
  document.querySelector(`.nav-item[data-id="${id}"]`)?.classList.add("active");
  document.getElementById("main").scrollTo(0, 0);
}

// Show newest (first) briefing on load
if (briefings.length > 0) show(briefings[0].id);
</script>
