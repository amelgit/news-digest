pan>$60,074</span><span>$126,198</span></div><div class=\"mkt-track\"><div class=\"mkt-dot\" style=\"left:30.5%\"></div></div></td><td class=\"mkt-pct mkt-neg \">-9.57%</td><td class=\"mkt-pct mkt-pos \">+6.77%</td><td class=\"mkt-pct mkt-pos \">+2.01%</td></tr><tr><td class=\"mkt-name\"><span class=\"mkt-status mkt-status-open\" title=\"Markt geöffnet\">●</span><a href=\"https://finance.yahoo.com/quote/GC%3DF/\" target=\"_blank\" class=\"mkt-link\">Gold</a></td><td class=\"mkt-close\">$4,766.20</td><td class=\"mkt-pct mkt-pos\">+$84.30</td><td class=\"mkt-pct mkt-pos mkt-day\">+1.80%</td><td class=\"mkt-range\"><div class=\"mkt-range-labels\"><span>$3,125.00</span><span>$5,586.20</span></div><div class=\"mkt-track\"><div class=\"mkt-dot\" style=\"left:66.7%\"></div></div></td><td class=\"mkt-pct mkt-pos \">+10.47%</td><td class=\"mkt-pct mkt-pos \">+0.35%</td><td class=\"mkt-pct mkt-pos \">+3.28%</td></tr></tbody></table><div class=\"mkt-analysis\"><div class=\"mkt-analysis-title\">🔍 Marktbewegung &amp; Nachrichten</div><p>Der deutliche Rückgang des Ölpreises um fast 4% ist die plausibelste Bewegung des Tages und spiegelt direkt die gestrigen Meldungen über eine bevorstehende Iran-USA-Einigung wider, die eine Entspannung der Nahostlage und damit erhöhte Ölversorgungssicherheit signalisiert. Der Goldanstieg von 1,8% erscheint zunächst kontraintuitiv, da Gold typischerweise in geopolitischen Krisen steigt – in diesem Kontext könnte er jedoch auf verbleibende Unsicherheiten im Ukraine-Konflikt sowie auf allgemeine Inflations- und Währungssorgen hindeuten. Der DAX-Rückgang von 0,67% überrascht angesichts des gestrigen Anstiegs von über 2% und der anhaltend positiven Nachrichten aus dem Nahostfriedenprozess, lässt sich aber als technische Korrektur nach der starken Vortagesrally erklären. Die Divergenz zwischen DAX und US-Indizes – NASDAQ im Plus, S&amp;P 500 leicht positiv – ist plausibel, da die Big-Tech-Quartalsberichte von Microsoft, Apple, Amazon und Co. offenbar weiterhin Zuversicht in den US-Technologiesektor nähren, während Europa stärker von Gewinnmitnahmen betroffen ist. Der Bitcoin-Rückgang von knapp 1,5% fügt sich in das Bild ein, nachdem Michael Saylors möglicher Verkauf als Stimmungsdämpfer für den Kryptomarkt gewirkt haben dürfte.</p></div></div>\n\n<h1>📰 Tages-Briefing – 7. Mai 2026</h1>\n\n<p>Die Nachrichtenlage wird heute von zwei dominanten Themen geprägt: den sich abzeichnenden Fortschritten bei den US-iranischen Nuklearverhandlungen sowie einer anhaltenden KI-Transformation, die zunehmend auch Arbeitsplätze kostet. An den internationalen Kapitalmärkten herrscht vorsichtiger Optimismus, während innenpolitisch in Deutschland fiskalische Spannungen zunehmen.</p>\n\n<hr>\n\n<h2>💻 Produktstrategie & Technologie</h2>\n\n<ul>\n  <li><strong>KI-Tools dominieren die Produktagenda:</strong> Claude Code, GPT 5.5 und neue Bildgenerierungsmodelle stehen im Mittelpunkt intensiver Nutzertests und interner Unternehmensanwendungen – etwa bei Stripe, wo ein eigenes KI-Tool die Produktentwicklung grundlegend verändert.</li>\n  <li><strong>Big-Tech-Quartalsergebnisse im Fokus:</strong> Microsoft, Apple, Amazon, Google und Meta haben ihre Zahlen vorgelegt; Amazons strukturelle Wettbewerbsstärke und der KI-Chip-Arm Trainium rücken als langfristige Differenzierungsmerkmale in den Vordergrund.</li>\n  <li><strong>Intel unter Druck:</strong> Die Quartalsergebnisse werfen Fragen zur strategischen Positionierung auf – insbesondere, ob Intels Differenzierungsstrategie im KI-Hardware-Markt tragfähig ist.</li>\n  <li><strong>Neue Geschäftsmodelle durch KI:</strong> Klassische SaaS-Freemium-Strategien verlieren laut Lenny's Newsletter ihre Wirksamkeit; stattdessen gewinnen API-basierte und agentengesteuerte Monetarisierungsmodelle an Bedeutung.</li>\n  <li><strong>Agentur vor Skill-Vermittlung:</strong> Produktführer wie Max Schoening (Notion) argumentieren, dass in der KI-Ära die Förderung von Eigeninitiative wichtiger wird als das reine Erlernen technischer Fähigkeiten.</li>\n</ul>\n\n<hr>\n\n<h2>📈 Finanzen & Wirtschaft</h2>\n\n<ul>\n  <li><strong>Iran-Deal beflügelt Märkte:</strong> Hoffnungen auf ein befristetes US-iranisches Rahmenabkommen treiben Aktienmärkte in eine Rallybewegung – gleichzeitig fällt der Ölpreis wieder unter 100 US-Dollar, was Inflationssorgen etwas dämpft.</li>\n  <li><strong>DAX knapp unter 25.000 Punkten:</strong> Trotz der globalen Euphorie fällt der deutsche Leitindex leicht zurück; Händler bleiben in Wartestellung, bis konkrete Abkommensbedingungen vorliegen.</li>\n  <li><strong>Steuerschätzung belastet Koalition:</strong> Sinkende Steuereinnahmen erhöhen den Druck innerhalb der Bundesregierung – die SPD fordert höhere Abgaben für Gutverdiener, was Verteilungskonflikte neu entfacht.</li>\n  <li><strong>Stellenabbau in der Industrie:</strong> Continental streicht allein in Deutschland 1.600 Arbeitsplätze, Thyssenkrupp befindet sich laut Insidern im „Endspiel\" eines radikalen Umbaus – strukturelle Schwäche im deutschen Industriesektor setzt sich fort.</li>\n  <li><strong>KI-Unternehmen entlassen ebenfalls:</strong> DeepL, der europäische KI-Übersetzungsdienst, baut rund ein Viertel seiner Belegschaft ab – ein Zeichen, dass der Kostendruck auch in der KI-Branche selbst ankommt.</li>\n</ul>\n\n<hr>\n\n<h2>🌍 Allgemeine Nachrichten</h2>\n\n<ul>\n  <li><strong>Diplomatik im Vatikan:</strong> US-Außenminister Marco Rubio besucht Papst Leo XIV. und versucht, die durch frühere Spannungen mit dem Vatikan belasteten Beziehungen zu reparieren.</li>\n  <li><strong>Zwei frühere chinesische Verteidigungsminister zum Tode verurteilt:</strong> Wei Fenghe und Li Shangfu wurden in einem Korruptionsverfahren zum Tod verurteilt – ein seltenes, politisch hochsymbolisches Signal aus Peking.</li>\n  <li><strong>Ukraine-Krieg: Waffenruhe unter Beschuss:</strong> Kiew wirft Russland Verstöße gegen die vereinbarte Waffenruhe vor; die Lage bleibt instabil und diplomatische Fortschritte fragil.</li>\n  <li><strong>WHO bestätigt Hantavirus-Fälle an Bord eines Kreuzfahrtschiffs:</strong> Fünf Infektionen wurden offiziell gemeldet – globale Gesundheitsbehörden beobachten die Entwicklung aufmerksam.</li>\n  <li><strong>Bundeswehr-Fragebogen wird zur Pflicht:</strong> Wer den staatlichen Erfassungsbogen nicht ausfüllt, riskiert künftig ein Bußgeld von 250 Euro – die Maßnahme spiegelt die wachsende sicherheitspolitische Sensibilität in Deutschland wider.</li>\n</ul>\n\n<hr>\n\n<h2>🔭 Ausblick</h2>\n\n<p>Die weitere Entwicklung der US-Iran-Gespräche dürfte in den kommenden Tagen marktbewegende Wirkung entfalten – sowohl für Öl- als auch für Aktienpreise. Parallel wird die politische Debatte in Deutschland über Steuererhöhungen und den industriellen Strukturwandel an Schärfe gewinnen.</p><details class=\"src-details\"><summary class=\"src-summary\"><span class=\"src-arrow\">▶</span>📰 Quellen &amp; Schlagzeilen (59 Artikel)</summary><div class=\"src-body\"><div class=\"src-category\"><div class=\"src-category-name\">Produktstrategie & Tech</div><div class=\"src-source\"><div class=\"src-source-name\">Stratechery</div><div class=\"src-item\"><a href=\"https://stratechery.com/2026/an-interview-with-joanna-stern-about-living-with-ai/\" target=\"_blank\" class=\"src-link\">An Interview with Joanna Stern About Living With AI</a><span class=\"src-date\">07.05.2026, 10:00</span></div><div class=\"src-item\"><a href=\"https://stratechery.com/2026/microsoft-earnings-apple-earnings/\" target=\"_blank\" class=\"src-link\">Microsoft Earnings, Apple Earnings</a><span class=\"src-date\">06.05.2026, 10:00</span></div><div class=\"src-item\"><a href=\"https://stratechery.com/2026/amazons-durability/\" target=\"_blank\" class=\"src-link\">Amazon’s Durability</a><span class=\"src-date\">05.05.2026, 10:01</span></div><div class=\"src-item\"><a href=\"https://stratechery.com/2026/google-earnings-meta-earnings/\" target=\"_blank\" class=\"src-link\">Google Earnings, Meta Earnings</a><span cl ];
const _n = new Date();
const _doy = Math.floor((_n - new Date(_n.getFullYear(),0,0)) / 86400000);
const _q = QQ[_doy % QQ.length];
document.getElementById("qt").textContent = _q.t;
document.getElementById("qa").textContent = "— " + _q.a;

/* ── Date label ─────────────────────────────────────── */
const DAYS = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MONS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
document.getElementById("dlbl").textContent =
  DAYS[_n.getDay()] + ", " + _n.getDate() + ". " + MONS[_n.getMonth()] + " " + _n.getFullYear();
const todayStr = _n.toISOString().slice(0,10);

/* ── Theme ──────────────────────────────────────────── */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.getElementById("tico").textContent = t === "dark" ? "☀️" : "🌙";
  document.getElementById("tlbl").textContent = t === "dark" ? "Hell" : "Dark";
}
function toggleTheme() {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem("theme", t); applyTheme(t);
}
applyTheme(localStorage.getItem("theme") ||
  (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

/* ── Category detection ─────────────────────────────── */
function catOf(txt) {
  const t = txt.toLowerCase();
  if (/finanz|wirtschaft|markt|börse|konjunktur|handel/.test(t)) return "finance";
  if (/politik|geopolit|sicherheit|außenpolitik|nachrichten|ausblick/.test(t)) return "politics";
  if (/tech|künstlich| ki |produkt|digital|startup/.test(t)) return "tech";
  return "other";
}
const CAT_MAP = {finance:"fin",politics:"pol",tech:"tec"};
const CAT_LBL = {finance:"Finanzen",politics:"Politik",tech:"Tech"};

function wrapSections(card) {
  const nodes = Array.from(card.childNodes);
  let sec = null;
  const frag = document.createDocumentFragment();
  for (const node of nodes) {
    const isH2 = node.nodeType === 1 && node.tagName === "H2";
    if (isH2) {
      const cat = catOf(node.textContent);
      sec = document.createElement("div");
      sec.className = "cs";
      sec.dataset.cat = cat;
      if (CAT_MAP[cat]) {
        const tag = document.createElement("span");
        tag.className = "stag " + CAT_MAP[cat];
        tag.textContent = CAT_LBL[cat];
        node.appendChild(tag);
      }
      frag.appendChild(sec);
    }
    (sec || frag).appendChild(node);
  }
  card.appendChild(frag);
}

/* ── Filter ─────────────────────────────────────────── */
let curFilter = "all";
function setFilter(cat) {
  curFilter = cat;
  document.querySelectorAll(".fbtn").forEach(b => b.classList.toggle("on", b.dataset.cat === cat));
  document.querySelectorAll(".cs").forEach(s =>
    s.classList.toggle("off", cat !== "all" && s.dataset.cat !== cat));
}

/* ── Show briefing ──────────────────────────────────── */
function show(id) {
  const b = briefings.find(x => x.id === id);
  if (!b) return;
  const view = document.getElementById("bview");
  view.innerHTML = '<div class="bc" id="bc">' + b.html + '</div>';
  wrapSections(document.getElementById("bc"));
  setFilter(curFilter);
  document.querySelectorAll(".arc-card").forEach(c => c.classList.toggle("on", c.dataset.id === id));
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ── Archive grid ───────────────────────────────────── */
const grid = document.getElementById("agrid");
briefings.forEach(b => {
  const c = document.createElement("div");
  c.className = "arc-card";
  c.dataset.id = b.id;
  c.innerHTML =
    '<div class="arc-wd">' + b.weekday + '</div>' +
    '<div class="arc-dt">' + b.date_display +
      (b.date === todayStr ? '<span class="today-pill">Heute</span>' : '') + '</div>' +
    '<div class="arc-pre">' + (b.preview || "") + '</div>';
  c.addEventListener("click", () => show(b.id));
  grid.appendChild(c);
});

if (briefings.length) show(briefings[0].id);

/* ── Stock Research ─────────────────────────────────── */
const STK = 'http://localhost:5001';
const _inp = document.getElementById('stk-inp');
const _sug = document.getElementById('stk-sug');
const _res = document.getElementById('stk-res');
let _st = null, _hi = -1;

_inp.addEventListener('input', () => {
  clearTimeout(_st);
  const q = _inp.value.trim();
  if (q.length < 2) { _hideSug(); return; }
  _st = setTimeout(() => _doSearch(q), 280);
});

_inp.addEventListener('keydown', e => {
  const items = _sug.querySelectorAll('.stk-sug-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); _nav(items, 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); _nav(items, -1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (_hi >= 0 && items[_hi]) items[_hi].click();
    else { _hideSug(); const q = _inp.value.trim().toUpperCase(); if (q) _loadStock(q); }
  }
  else if (e.key === 'Escape') _hideSug();
});

document.addEventListener('click', e => { if (!e.target.closest('#stk-sec')) _hideSug(); });

function _nav(items, dir) {
  if (!items.length) return;
  if (_hi >= 0) items[_hi].classList.remove('hi');
  _hi = Math.max(0, Math.min(items.length - 1, _hi + dir));
  items[_hi].classList.add('hi');
  items[_hi].scrollIntoView({block:'nearest'});
}

async function _doSearch(q) {
  try {
    const r = await fetch(`${STK}/api/search?q=${encodeURIComponent(q)}`);
    if (!r.ok) throw new Error();
    const data = await r.json();
    if (!Array.isArray(data) || !data.length) { _hideSug(); return; }
    _hi = -1;
    _sug.innerHTML = data.map(s =>
      `<div class="stk-sug-item" onclick="_pick(${JSON.stringify(s.symbol)})">` +
      `<span class="sug-sym">${_e(s.symbol)}</span>` +
      `<span class="sug-nm">${_e(s.name)}</span>` +
      `<span class="sug-ex">${_e(s.exchange||'')}</span></div>`
    ).join('');
    _sug.style.display = 'block';
  } catch { _hideSug(); }
}

function _pick(sym) { _inp.value = sym; _hideSug(); _loadStock(sym); }
function _hideSug() { _sug.style.display = 'none'; _hi = -1; }
function _e(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function _fmt(n, d=2) {
  if (n == null || isNaN(n)) return '—';
  if (Math.abs(n) >= 1e12) return (n/1e12).toFixed(2) + ' Bio.';
  if (Math.abs(n) >= 1e9)  return (n/1e9).toFixed(2)  + ' Mrd.';
  if (Math.abs(n) >= 1e6)  return (n/1e6).toFixed(1)  + ' Mio.';
  return n.toLocaleString('de-DE', {maximumFractionDigits: d});
}
function _vol(n) {
  if (n == null || isNaN(n)) return '—';
  if (n >= 1e9) return (n/1e9).toFixed(2) + 'Mrd';
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'Mio';
  if (n >= 1e3) return Math.round(n/1e3) + 'k';
  return String(n);
}

async function _loadStock(sym) {
  _res.style.display = 'block';
  _res.innerHTML = `<div class="stk-ov"><div style="display:flex;align-items:center;gap:10px;padding:12px 0">` +
    `<div class="spin"></div><span style="color:var(--mu);font-size:14px">Lade ${_e(sym)}…</span></div></div>`;
  document.getElementById('stk-sec').scrollIntoView({behavior:'smooth', block:'nearest'});

  try {
    const [ir, hr] = await Promise.all([
      fetch(`${STK}/api/stock/${sym}`),
      fetch(`${STK}/api/stock/${sym}/history`),
    ]);
    const info = await ir.json();
    const hist = await hr.json();
    if (info.error) throw new Error(info.error);

    const up = (info.change ?? 0) >= 0;
    const cc = up ? 'stk-up' : 'stk-dn';
    const cs = up ? '+' : '';

    // 52-week dot position
    const lo = info.week52_low, hi52 = info.week52_high, pr = info.price;
    const dot = (lo && hi52 && hi52 > lo)
      ? Math.max(0, Math.min(100, (pr - lo) / (hi52 - lo) * 100)).toFixed(1) : '50';

    const ov =
      `<div class="stk-ov">` +
      `<div class="stk-co">` +
      `<strong>${_e(info.name)}</strong>` +
      `<span style="opacity:.35">·</span><span>${_e(info.symbol)}</span>` +
      `<span style="opacity:.35">·</span><span>${_e(info.currency||'USD')}</span>` +
      (info.sector ? `<span class="stk-sector">${_e(info.sector)}</span>` : '') +
      `</div>` +
      `<div class="stk-pr-row">` +
      `<span class="stk-pr">${info.price?.toFixed(2) ?? '—'}</span>` +
      `<span class="stk-ch ${cc}">${cs}${info.change?.toFixed(2) ?? '—'}&ensp;(${cs}${info.change_pct?.toFixed(2) ?? '—'}%)</span>` +
      `</div>` +
      `<div class="stk-mets">` +
      `<div class="stk-met"><div class="stk-ml">Marktkapital.</div><div class="stk-mv">${_fmt(info.market_cap)}</div></div>` +
      `<div class="stk-met"><div class="stk-ml">KGV (P/E)</div><div class="stk-mv">${info.pe_ratio ? info.pe_ratio.toFixed(1) : '—'}</div></div>` +
      `<div class="stk-met"><div class="stk-ml">52W Hoch / Tief</div>` +
        `<div class="stk-mv">${info.week52_high?.toFixed(2) ?? '—'} / ${info.week52_low?.toFixed(2) ?? '—'}</div>` +
        `<div class="w52-bar"><div class="w52-dot" style="left:${dot}%"></div></div></div>` +
      `<div class="stk-met"><div class="stk-ml">Volumen</div><div class="stk-mv">${_vol(info.volume)}</div></div>` +
      `<div class="stk-met"><div class="stk-ml">Ø Volumen</div><div class="stk-mv">${_vol(info.avg_volume)}</div></div>` +
      (info.industry ? `<div class="stk-met"><div class="stk-ml">Branche</div><div class="stk-mv" style="font-size:13px">${_e(info.industry)}</div></div>` : '') +
      `</div></div>`;

    const ch = Array.isArray(hist) && hist.length > 1
      ? `<div class="stk-ch-card"><div class="stk-ch-ttl">Kursverlauf — 30 Tage</div>${_chart(hist, up)}</div>`
      : '';

    const ai =
      `<div class="stk-ai" id="stk-ai-box">` +
      `<div class="ai-ttl">KI-Analyse</div>` +
      `<div class="ai-spin"><div class="spin"></div>Analysiere ${_e(info.name)}…</div>` +
      `</div>`;

    _res.innerHTML = ov + ch + ai;
    _loadAI(sym);

  } catch(e) {
    _res.innerHTML =
      `<div class="stk-ov" style="text-align:center;padding:36px">` +
      `<div style="font-size:28px;margin-bottom:10px">⚠️</div>` +
      `<div style="color:var(--rd);margin-bottom:8px;font-weight:600">${_e(e.message)}</div>` +
      `<div style="font-size:13px;color:var(--mu)">Läuft der Flask-Server?&ensp;` +
      `<code style="background:var(--sf2);padding:2px 6px;border-radius:5px">python app.py</code></div></div>`;
  }
}

async function _loadAI(sym) {
  try {
    const r = await fetch(`${STK}/api/stock/${sym}/summary`);
    const d = await r.json();
    const box = document.getElementById('stk-ai-box');
    if (!box) return;
    box.innerHTML = `<div class="ai-ttl">KI-Analyse</div>` +
      (d.error
        ? `<div style="color:var(--mu);font-size:13px">${_e(d.error)}</div>`
        : `<div class="ai-body">${_e(d.summary)}</div>`);
  } catch {
    const box = document.getElementById('stk-ai-box');
    if (box) box.innerHTML = `<div class="ai-ttl">KI-Analyse</div><div style="color:var(--mu);font-size:13px">Nicht verfügbar</div>`;
  }
}

function _chart(data, isUp) {
  const prices = data.map(d => d.close);
  const min = Math.min(...prices), max = Math.max(...prices);
  const rng = (max - min) || max * 0.005 || 1;
  const col = isUp ? 'var(--gn)' : 'var(--rd)';
  const W=660, H=150, pL=54, pR=10, pT=8, pB=26;
  const cw = W-pL-pR, ch = H-pT-pB, n = data.length;
  const px = i => pL + (i/(n-1))*cw;
  const py = v => pT + ch - ((v-min)/rng)*ch;

  const line = data.map((d,i) => `${i?'L':'M'}${px(i).toFixed(1)},${py(d.close).toFixed(1)}`).join('');
  const area = `${line} L${px(n-1).toFixed(1)},${(pT+ch).toFixed(1)} L${pL},${(pT+ch).toFixed(1)} Z`;
  const gid  = 'g' + Math.random().toString(36).slice(2,8);

  let grid='', yl='';
  for (let i=0; i<=4; i++) {
    const v=min+rng*i/4, yy=py(v).toFixed(1);
    grid += `<line x1="${pL}" y1="${yy}" x2="${W-pR}" y2="${yy}" stroke="var(--bd)" stroke-width="1" stroke-dasharray="3,3"/>`;
    yl   += `<text x="${pL-5}" y="${(+yy+4).toFixed(1)}" text-anchor="end" class="chart-lbl">${v.toFixed(2)}</text>`;
  }
  let xl='';
  [0,.25,.5,.75,1].forEach(f => {
    const i = Math.min(n-1, Math.round(f*(n-1)));
    xl += `<text x="${px(i).toFixed(1)}" y="${H-5}" text-anchor="middle" class="chart-lbl">${data[i].date.slice(5)}</text>`;
  });
  const lx=px(n-1).toFixed(1), ly=py(prices[n-1]).toFixed(1);

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;overflow:visible">` +
    `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">` +
    `<stop offset="0%" stop-color="${col}" stop-opacity=".18"/>` +
    `<stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>` +
    `${grid}` +
    `<path d="${area}" fill="url(#${gid})"/>` +
    `<path d="${line}" style="stroke:${col}" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>` +
    `<circle cx="${lx}" cy="${ly}" r="4" style="fill:${col}" stroke="var(--sf)" stroke-width="2"/>` +
    `${yl}${xl}</svg>`;
}
</script>
