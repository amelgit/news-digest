<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morgen-Briefing</title>
<style>
/* ── Variables ───────────────────────────────────────── */
:root {
  --bg:       #f8f7f4;
  --sf:       #ffffff;
  --sf2:      #f2f1ee;
  --bd:       #e8e5e0;
  --tx:       #1a1917;
  --mu:       #78716c;
  --ac:       #1d4ed8;
  --ac2:      #eff6ff;
  --gn:       #15803d;
  --rd:       #b91c1c;
  --qbg:      #fffbeb;
  --qbd:      #fde68a;
  --fin-bg:   #dcfce7; --fin-tx: #166534;
  --pol-bg:   #f3e8ff; --pol-tx: #6d28d9;
  --tec-bg:   #dbeafe; --tec-tx: #1d4ed8;
}
[data-theme="dark"] {
  --bg:       #0d0c0a;
  --sf:       #181614;
  --sf2:      #211e1b;
  --bd:       #2e2b27;
  --tx:       #f4f2ed;
  --mu:       #9e9188;
  --ac:       #60a5fa;
  --ac2:      #172036;
  --gn:       #4ade80;
  --rd:       #f87171;
  --qbg:      #1a1508;
  --qbd:      #5a4e28;
  --fin-bg:   #14532d; --fin-tx: #86efac;
  --pol-bg:   #2d1f5e; --pol-tx: #c4b5fd;
  --tec-bg:   #172036; --tec-tx: #93c5fd;
}
/* ── Reset ───────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
     background:var(--bg);color:var(--tx);line-height:1.6;min-height:100vh;
     transition:background .25s,color .25s}
/* ── Header ──────────────────────────────────────────── */
#hdr{position:sticky;top:0;z-index:100;background:var(--sf);border-bottom:1px solid var(--bd)}
.hdr-in{max-width:900px;margin:0 auto;padding:0 24px;height:54px;
        display:flex;align-items:center;justify-content:space-between}
.logo{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
      color:var(--tx);text-decoration:none}
.logo em{color:var(--ac);font-style:normal}
.hdr-r{display:flex;align-items:center;gap:14px}
#dlbl{font-size:12px;color:var(--mu)}
.tbtn{display:flex;align-items:center;gap:5px;background:var(--sf2);
      border:1px solid var(--bd);border-radius:20px;padding:5px 13px;
      font-size:12px;cursor:pointer;color:var(--mu);transition:border-color .15s,color .15s}
.tbtn:hover{border-color:var(--ac);color:var(--tx)}
/* ── Page ────────────────────────────────────────────── */
.pg{max-width:900px;margin:0 auto;padding:36px 24px 80px}
/* ── Stoic quote ─────────────────────────────────────── */
.quote{background:var(--qbg);border:1px solid var(--qbd);border-radius:12px;
       padding:20px 26px;margin-bottom:28px;display:flex;align-items:flex-start;gap:14px}
.qm{font-size:48px;line-height:1;color:var(--qbd);font-family:Georgia,serif;
    margin-top:-8px;flex-shrink:0;user-select:none}
.qt{font-size:15px;line-height:1.65;font-style:italic;
    font-family:Georgia,"Times New Roman",serif;color:var(--tx);margin-bottom:6px}
.qa{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mu)}
/* ── Filter bar ──────────────────────────────────────── */
.filters{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.fbtn{padding:6px 16px;border-radius:20px;border:1px solid var(--bd);
      background:var(--sf);color:var(--mu);font-size:13px;font-weight:500;
      cursor:pointer;transition:all .15s;white-space:nowrap}
.fbtn:hover{border-color:var(--ac);color:var(--tx)}
.fbtn.on{background:var(--ac);border-color:var(--ac);color:#fff}
/* ── Briefing card ───────────────────────────────────── */
.bc{background:var(--sf);border:1px solid var(--bd);border-radius:16px;
    padding:44px 52px;
    box-shadow:0 1px 4px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.04);
    margin-bottom:52px}
.cs{transition:opacity .15s}
.cs.off{display:none}
/* typography */
.bc h1{font-size:27px;font-weight:800;line-height:1.25;letter-spacing:-.01em;margin-bottom:6px}
.bc h2{font-size:15px;font-weight:700;margin:36px 0 14px;padding:10px 14px;
        background:var(--sf2);border-radius:8px;border-left:3px solid var(--ac);
        display:flex;align-items:center;justify-content:space-between;gap:10px}
.stag{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
      padding:2px 8px;border-radius:10px;flex-shrink:0}
.stag.fin{background:var(--fin-bg);color:var(--fin-tx)}
.stag.pol{background:var(--pol-bg);color:var(--pol-tx)}
.stag.tec{background:var(--tec-bg);color:var(--tec-tx)}
.bc h3{font-size:13px;font-weight:700;margin:20px 0 8px;
        text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.bc p{font-size:15px;line-height:1.82;color:var(--tx);margin-bottom:14px;
      font-family:Georgia,"Times New Roman",serif}
.bc ul{list-style:none;padding:0;margin:0 0 16px}
.bc li{font-size:15px;line-height:1.75;padding:7px 0 7px 26px;position:relative;
        border-bottom:1px solid var(--bd);
        font-family:Georgia,"Times New Roman",serif}
.bc li:last-child{border-bottom:none}
.bc li::before{content:"→";position:absolute;left:0;top:9px;
               color:var(--ac);font-size:12px;font-family:sans-serif}
.bc hr{border:none;border-top:1px solid var(--bd);margin:28px 0}
.bc strong{font-weight:700}
.bc a{color:var(--ac);text-decoration:none}
.bc a:hover{text-decoration:underline}
.bc code{background:var(--sf2);padding:1px 5px;border-radius:4px;
          font-size:12px;font-family:"SF Mono","Fira Code",monospace}
/* ── Market widget ───────────────────────────────────── */
.mkt-widget{background:var(--sf2);border:1px solid var(--bd);border-radius:12px;
             padding:20px 24px;margin-bottom:32px;overflow-x:auto}
.mkt-header{display:flex;align-items:baseline;justify-content:space-between;
             gap:12px;margin-bottom:16px}
.mkt-title{font-size:14px;font-weight:700}
.mkt-date-label{font-size:11px;color:var(--mu);white-space:nowrap}
.mkt-table{width:100%;border-collapse:collapse;min-width:480px}
.mkt-table th{font-size:10px;font-weight:600;color:var(--mu);text-transform:uppercase;
               letter-spacing:.06em;padding:0 6px 8px;border-bottom:1px solid var(--bd);
               text-align:right;white-space:nowrap}
.mkt-table th:first-child{text-align:left}
.mkt-table th:nth-child(3){text-align:left}
.mkt-table td{padding:6px;border-bottom:1px solid var(--bd);vertical-align:middle;font-size:12px}
.mkt-table tr:last-child td{border-bottom:none}
.mkt-name{font-weight:600;white-space:nowrap}
.mkt-close{text-align:right;font-family:"SF Mono",monospace;white-space:nowrap}
.mkt-range{min-width:130px;padding-top:8px !important;padding-bottom:8px !important}
.mkt-range-labels{display:flex;justify-content:space-between;font-size:9px;
                   color:var(--mu);font-family:"SF Mono",monospace;margin-bottom:4px}
.mkt-track{height:3px;background:var(--bd);border-radius:2px;position:relative}
.mkt-dot{position:absolute;width:7px;height:7px;background:var(--ac);border-radius:50%;
          top:-2px;transform:translateX(-50%);box-shadow:0 0 0 2px var(--sf2)}
.mkt-pct{text-align:right;font-family:"SF Mono",monospace;font-size:11px;
          font-weight:600;white-space:nowrap}
.mkt-pos{color:var(--gn)}
.mkt-neg{color:var(--rd)}
.mkt-neutral{color:var(--mu)}
.mkt-day{border-left:2px solid var(--bd)}
.mkt-link{color:inherit;text-decoration:none;border-bottom:1px dotted var(--mu)}
.mkt-link:hover{color:var(--ac)}
.mkt-status{font-size:9px;margin-right:4px}
.mkt-status-open{color:#22c55e}
.mkt-status-pre,.mkt-status-post{color:#f59e0b}
.mkt-status-closed{color:var(--mu)}
.mkt-pre{display:block;font-size:10px;font-family:"SF Mono",monospace;margin-top:2px}
.mkt-pre-label{color:var(--mu)}
.mkt-pre-pos{color:var(--gn)}
.mkt-pre-neg{color:var(--rd)}
.mkt-analysis{margin-top:16px;padding:14px 18px;background:var(--ac2);
               border:1px solid var(--ac);border-radius:8px;
               font-size:13px;line-height:1.65;color:var(--tx)}
.mkt-analysis-title{font-size:10px;font-weight:700;letter-spacing:.08em;
                      text-transform:uppercase;color:var(--ac);margin-bottom:8px}
.mkt-analysis p{margin:0 0 6px;font-size:13px;color:var(--tx);line-height:1.65}
.mkt-analysis p:last-child{margin-bottom:0}
/* ── Sources ─────────────────────────────────────────── */
.src-details{margin-top:32px;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.src-summary{cursor:pointer;padding:12px 18px;background:var(--sf2);font-size:12px;
              font-weight:600;color:var(--mu);list-style:none;user-select:none;
              display:flex;align-items:center;gap:6px}
.src-summary::-webkit-details-marker{display:none}
.src-arrow{font-size:9px;transition:transform .15s;display:inline-block}
details[open] .src-arrow{transform:rotate(90deg)}
.src-body{padding:16px 20px}
.src-category{margin-bottom:20px}
.src-category:last-child{margin-bottom:0}
.src-category-name{font-size:10px;font-weight:700;letter-spacing:.08em;
                    text-transform:uppercase;color:var(--ac);margin-bottom:10px}
.src-source{margin-bottom:14px}
.src-source:last-child{margin-bottom:0}
.src-source-name{font-size:11px;font-weight:600;color:var(--mu);margin-bottom:5px;
                  padding-bottom:4px;border-bottom:1px solid var(--bd)}
.src-item{display:flex;justify-content:space-between;align-items:baseline;
           gap:16px;padding:4px 0;border-bottom:1px solid var(--sf2)}
.src-item:last-child{border-bottom:none}
.src-link{font-size:13px;color:var(--tx);text-decoration:none;flex:1;line-height:1.4}
.src-link:hover{color:var(--ac);text-decoration:underline}
.src-no-link{font-size:13px;color:var(--tx);flex:1;line-height:1.4}
.src-date{font-size:10px;color:var(--mu);white-space:nowrap;
           font-family:"SF Mono",monospace;flex-shrink:0}
/* ── Archive ─────────────────────────────────────────── */
.arc-hd{font-size:11px;font-weight:700;letter-spacing:.08em;
         text-transform:uppercase;color:var(--mu);margin-bottom:16px}
.arc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.arc-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;
           padding:16px 18px;cursor:pointer;
           transition:border-color .15s,transform .15s,box-shadow .15s}
.arc-card:hover{border-color:var(--ac);
                box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-2px)}
.arc-card.on{border-color:var(--ac);background:var(--ac2)}
.arc-wd{font-size:10px;font-weight:600;letter-spacing:.06em;
         text-transform:uppercase;color:var(--mu);margin-bottom:3px}
.arc-dt{font-size:14px;font-weight:700;margin-bottom:7px;
         display:flex;align-items:center;gap:7px}
.today-pill{font-size:10px;font-weight:600;background:var(--ac);
             color:#fff;padding:1px 8px;border-radius:10px}
.arc-pre{font-size:12px;color:var(--mu);line-height:1.5;
          display:-webkit-box;-webkit-line-clamp:2;
          -webkit-box-orient:vertical;overflow:hidden}
/* ── Responsive ──────────────────────────────────────── */
@media(max-width:640px){
  .pg{padding:20px 16px 60px}
  .bc{padding:24px 20px;border-radius:12px}
  .bc h1{font-size:22px}
  .bc h2{font-size:14px}
  .quote{padding:16px 18px}
  .qm{font-size:32px}
  .arc-grid{grid-template-columns:1fr 1fr;gap:8px}
  .arc-card{padding:12px 14px}
  .filters{gap:6px}
  .fbtn{padding:5px 12px;font-size:12px}
  #dlbl{display:none}
}
/* ── Stock Research ──────────────────────────────────── */
.stk-sec{margin-top:52px;padding-top:48px;border-top:1px solid var(--bd)}
.stk-hdr{display:flex;align-items:center;justify-content:space-between;
          flex-wrap:wrap;gap:16px;margin-bottom:22px}
.stk-wrap{position:relative;width:340px}
.stk-inp{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--bd);
          border-radius:10px;background:var(--sf);color:var(--tx);
          font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.stk-inp::placeholder{color:var(--mu)}
.stk-inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 15%,transparent)}
.stk-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);
          font-size:14px;pointer-events:none;opacity:.5}
.stk-sug{position:absolute;top:calc(100% + 5px);left:0;right:0;
          background:var(--sf);border:1px solid var(--bd);border-radius:10px;
          box-shadow:0 8px 28px rgba(0,0,0,.12);z-index:50;overflow:hidden;display:none}
.stk-sug-item{padding:10px 14px;cursor:pointer;display:flex;
               align-items:center;gap:10px;border-bottom:1px solid var(--bd)}
.stk-sug-item:last-child{border-bottom:none}
.stk-sug-item:hover,.stk-sug-item.hi{background:var(--sf2)}
.sug-sym{font-size:13px;font-weight:700;min-width:52px;color:var(--tx)}
.sug-nm{font-size:12px;color:var(--mu);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sug-ex{font-size:10px;color:var(--mu);flex-shrink:0;letter-spacing:.04em}
/* Stock result */
.stk-res{display:none}
.stk-ov{background:var(--sf);border:1px solid var(--bd);border-radius:16px;
         padding:28px 32px;margin-bottom:16px}
.stk-co{font-size:13px;color:var(--mu);margin-bottom:8px;
         display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stk-co strong{color:var(--tx);font-size:14px}
.stk-sector{font-size:10px;font-weight:600;background:var(--sf2);
             padding:2px 8px;border-radius:8px;color:var(--mu)}
.stk-pr-row{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.stk-pr{font-size:40px;font-weight:800;letter-spacing:-.025em;line-height:1}
.stk-ch{font-size:17px;font-weight:600}
.stk-up{color:var(--gn)}
.stk-dn{color:var(--rd)}
.stk-mets{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.stk-met{background:var(--sf2);border-radius:10px;padding:12px 16px}
.stk-ml{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
         color:var(--mu);margin-bottom:5px}
.stk-mv{font-size:15px;font-weight:700;color:var(--tx)}
/* 52-week range bar */
.w52-bar{margin-top:7px;position:relative;height:4px;background:var(--bd);border-radius:2px}
.w52-dot{position:absolute;width:10px;height:10px;background:var(--ac);
          border-radius:50%;top:-3px;transform:translateX(-50%);
          box-shadow:0 0 0 2px var(--sf2)}
/* Chart */
.stk-ch-card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;
              padding:22px 28px;margin-bottom:16px}
.stk-ch-ttl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
              color:var(--mu);margin-bottom:14px}
.chart-lbl{font-size:10px;fill:var(--mu);font-family:"SF Mono","Fira Code",monospace}
/* AI summary */
.stk-ai{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:24px 32px}
.ai-ttl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
         color:var(--ac);margin-bottom:10px}
.ai-body{font-size:15px;line-height:1.78;font-family:Georgia,"Times New Roman",serif;color:var(--tx)}
.ai-spin{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:14px}
/* Spinner */
@keyframes sp{to{transform:rotate(360deg)}}
.spin{width:16px;height:16px;border:2px solid var(--bd);border-top-color:var(--ac);
       border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
@media(max-width:640px){
  .stk-sec{margin-top:36px;padding-top:36px}
  .stk-hdr{flex-direction:column;align-items:stretch}
  .stk-wrap{width:100%}
  .stk-ov{padding:20px}
  .stk-ai{padding:20px}
  .stk-pr{font-size:32px}
  .stk-mets{grid-template-columns:repeat(auto-fill,minmax(115px,1fr))}
}
</style>
</head>
<body>

<header id="hdr">
  <div class="hdr-in">
    <a class="logo" href="#">Morgen<em>·</em>Briefing</a>
    <div class="hdr-r">
      <span id="dlbl"></span>
      <button class="tbtn" id="tbtn" onclick="toggleTheme()">
        <span id="tico">🌙</span><span id="tlbl">Dark</span>
      </button>
    </div>
  </div>
</header>

<div class="pg">

  <div class="quote">
    <div class="qm">"</div>
    <div>
      <div class="qt" id="qt"></div>
      <div class="qa" id="qa"></div>
    </div>
  </div>

  <div class="filters">
    <button class="fbtn on" data-cat="all"     onclick="setFilter('all')">Alle</button>
    <button class="fbtn"    data-cat="finance"  onclick="setFilter('finance')">Finanzen</button>
    <button class="fbtn"    data-cat="politics" onclick="setFilter('politics')">Politik</button>
    <button class="fbtn"    data-cat="tech"     onclick="setFilter('tech')">Tech</button>
  </div>

  <div id="bview"></div>

  <div class="arc-hd">Archiv</div>
  <div class="arc-grid" id="agrid"></div>

  <!-- Stock Research -->
  <section class="stk-sec" id="stk-sec">
    <div class="stk-hdr">
      <div class="arc-hd" style="margin-bottom:0">Aktienrecherche</div>
      <div class="stk-wrap">
        <span class="stk-ico">🔍</span>
        <input class="stk-inp" id="stk-inp" type="text"
               placeholder="Ticker oder Unternehmen, z.B. AAPL oder Siemens"
               autocomplete="off" spellcheck="false">
        <div class="stk-sug" id="stk-sug"></div>
      </div>
    </div>
    <div class="stk-res" id="stk-res"></div>
  </section>

</div>

<script>
const briefings = [
  {
    "id": "2026-05-09",

    "date_display": "9. Mai 2026",

um +0,64% gestiegen ist, was auf begrenzte Angebotssorgen der Marktteilnehmer hindeutet. Gold legte mit +0,44% leicht zu, was den klassischen Safe-Haven-Reflex bei geopolitischer Unsicherheit widerspiegelt, der Anstieg fällt jedoch angesichts der Konfliktlage eher bescheiden aus. Der nahezu stagnierende Dow Jones (+0,02%) im Kontrast zum starken NASDAQ verdeutlicht die klare Sektorrotation hin zu Tech- und KI-Werten, während traditionelle Industrie- und Finanzwerte kaum profitieren konnten.</p></div></div>\n\n<h1>📰 Tages-Briefing – 9. Mai 2026</h1>\n\n<hr>\n\n<h2>Einleitung</h2>\n\n<p>Die geopolitische Lage bleibt angespannt: Der Konflikt im Iran und seine Auswirkungen auf den Strait of Hormuz dominieren die globale Finanz- und Sicherheitsagenda. Gleichzeitig sorgen Machtwechsel in Europa und neue Weichenstellungen in der KI-Industrie für weitreichende strategische Bewegungen.</p>\n\n<hr>\n\n<h2>🌍 Politik & Allgemeine Nachrichten</h2>\n\n<ul>\n  <li><strong>Iran-Konflikt im Fokus:</strong> Trump wartet auf Irans Antwort zu einem US-Vorschlag; Teheran erklärt Gefechte in der Straße von Hormuz offiziell für beendet – die diplomatische Lage bleibt jedoch fragil.</li>\n  <li><strong>Machtwechsel in Ungarn:</strong> Peter Magyar wurde am Europatag vereidigt und läutet damit einen historischen politischen Wechsel in Budapest ein.</li>\n  <li><strong>Dänemark und EU:</strong> In Dänemark soll der Rechtsliberale Poulsen eine neue Regierung bilden; in der EU wird ernsthaft über eine Abschaffung der Einstimmigkeitsregel debattiert.</li>\n  <li><strong>Putin und die Siegesparade:</strong> Der russische Präsident nahm die Militärparade in Moskau im Schutz einer Waffenruhe ab – Kommentatoren sehen darin ein Zeichen struktureller Schwäche.</li>\n  <li><strong>Großbritannien nach den Kommunalwahlen:</strong> Labours deutliche Verluste befeuern Spekulationen über das Ende der Regierungsmehrheit unter Premierminister Starmer.</li>\n</ul>\n\n<hr>\n\n<h2>💰 Finanznachrichten</h2>\n\n<ul>\n  <li><strong>Hormuz-Krise trifft Weltwirtschaft:</strong> Chinas Energieimporte brechen ein, da Tanker die blockierte Meerenge meiden; gleichzeitig verschärft sich Afrikas Düngemittelkrise durch den Iran-Krieg.</li>\n  <li><strong>Chinas Exporte überraschend stark:</strong> Trotz Kriegsturbulenzen stiegen Chinas Exporte um 14 % – offenbar im Vorfeld des Xi-Trump-Gipfels als strategisches Signal.</li>\n  <li><strong>Fed und EZB im Wartemodus:</strong> Goldman Sachs verschiebt die Prognose für US-Zinssenkungen auf Dezember; EZB-Chefin Lagarde betont das Dilemma zwischen zu frühem und zu spätem Handeln.</li>\n  <li><strong>US-Sanktionen gegen China:</strong> Washington verhängt neue Strafmaßnahmen gegen chinesische Unternehmen wegen mutmaßlicher Iran-Unterstützung – ein weiterer Eskalationsschritt im Handelsstreit.</li>\n  <li><strong>Finanzmärkte im Stresstest:</strong> Jane Street verdiente im ersten Quartal 10 Milliarden Dollar; Pakistan erhält IMF-Mittel; Versicherer aus Florida und Louisiana wagen trotz Krisenumfeld den Börsengang.</li>\n</ul>\n\n<hr>\n\n<h2>💻 Produktstrategie & Tech</h2>\n\n<ul>\n  <li><strong>Big Tech dominiert Quartalssaison:</strong> Microsoft, Apple, Amazon, Google und Meta haben Quartalsergebnisse vorgelegt – Amazon und Meta stechen laut Analysten durch besondere Widerstandsfähigkeit hervor.</li>\n  <li><strong>KI im Alltagstest:</strong> Ein Interview mit Joanna Stern beleuchtet, wie KI den Alltag verändert – ein wachsendes Thema in der öffentlichen Wahrnehmung.</li>\n  <li><strong>OpenAI und AWS kooperieren:</strong> Sam Altman und AWS-CEO Matt Garman diskutieren Bedrock Managed Agents – ein Signal für tiefere Cloud-KI-Partnerschaften.</li>\n  <li><strong>Hardware und Display-Zukunft:</strong> Neue Entwicklungen bei AI-Hardware und Metas Display-Strategie werfen Fragen zur Neudefinition von VR und AR auf.</li>\n  <li><strong>Intels Zukunft ungewiss:</strong> Intels Quartalszahlen und strategische Positionierung sorgen für Diskussionen – wohin führt der Weg für den angeschlagenen Chiphersteller?</li>\n</ul>\n\n<hr>\n\n<h2>🔭 Ausblick</h2>\n\n<p>Die kommenden Tage werden maßgeblich vom Ausgang der Iran-Diplomatie und dem erwarteten Xi-Trump-Gipfel geprägt sein – beide Ereignisse haben das Potenzial, Märkte, Energiepreise und geopolitische Allianzen grundlegend zu verschieben. Zugleich verdichten sich in Europa die politischen Signale: Machtwechsel in Ungarn und Debatten über EU-Reformen könnten die Handlungsfähigkeit des Kontinents in der Krise entscheidend beeinflussen.</p><details class=\"src-details\"><summary class=\"src-summary\"><span class=\"src-arrow\">▶</span>📰 Quellen &amp; Schlagzeilen (60 Artikel)</summary><div class=\"src-body\"><div class=\"src-category\"><div class=\"src-category-name\">Produktstrategie & Tech</div><div class=\"src-source\"><div class=\"src-source-name\">Stratechery</div><div class=\"src-item\"><a href=\"https://stratechery.com/2026/earning-spending/\" target=\"_blank\" class=\"src-link\">2026.19: Earning &amp; Spending</a><span class=\"src-date\">08.05.2026, 17:00</span></div><div class=\"src-item\"><a href=\"https://stratechery.com/2026/an-interview-with-joanna-stern-about-living-with-ai/\" target=\"_blank\" class=\"src-link\">An Interview with Joanna Stern About Living With AI</a><span class=\"src-date\">07.05.2026, 10:00</span></div><div class=\"src-item\"><a href=\"https://stratechery.com/2026/microsoft-earnings-apple-earnings/\" target=\"_blank\" class=\"src-link\">Microsoft Earnings, Apple Earnings</a><span class=\"src-date\">06.05.2026, 10:00</span></div><div class=\"src-item\"><a href=\"https://stratechery.com/2026/amazons-durability/\" target=\"_blank\" class=\"src-link\">Amazon’s Durability</a><span class=\"src-date\">05.05.2026, 10:01</span></div><div class=\"src-item\"><a href=\"https://stratechery.com/2026/google-earnings-meta-earnings/\" target=\"_blank\" class=\"src-link\">Google Earnings, Meta Earnings</a><span class=\"src-date\">04.05.2026, 10:00</s  daher darauf hin, dass die Marktteilnehmer die Wahrscheinlichkeit eines baldigen Abschlusses inzwischen niedriger einschätzen. Gold als klassischer Krisenindikator legt entsprechend zu (+0,50%), was die gestiegene Risikoaversion der Investoren bestätigt und konsistent mit den Aktienverlusten ist. Insgesamt zeichnet die heutige Kurskonstellation das Bild einer klassischen „Risk-off\"-Bewegung, in der Anleger Aktien und Bitcoin meiden und in sichere Häfen wie Gold umschichten.</p></div></div>\n\n<h1>📰 Tagesbrief – 08. Mai 2026</h1>\n\n<p>Die Welt steht heute im Zeichen massiver KI-Investitionen und geopolitischer Spannungen. Während Tech-Konzerne Hunderte Milliarden in künstliche Intelligenz pumpen, eskalieren die Konflikte in der Ukraine und im Nahen Osten weiter. Der folgende Überblick fasst die wichtigsten Entwicklungen des Tages zusammen.</p>\n\n<hr>\n\n<h2>🤖 Produktstrategie & Technologie</h2>\n\n<ul>\n  <li><strong>Claude Code im Fokus:</strong> Anthropic präsentiert die fünf bedeutendsten Updates zu „Code with Claude\" – das Tool festigt seinen Platz als zentrales Entwickler-Werkzeug im KI-Ökosystem.</li>\n  <li><strong>KI-Adoption in Unternehmen:</strong> Sendbird-CEO John Kim skizziert ein neues Playbook für interne KI-Einführung – mit Quests, Token-Leaderboards und einem Skills-Marktplatz als Gamification-Ansatz.</li>\n  <li><strong>Das Ende klassischer Freemium-Modelle:</strong> SaaS-Strategien greifen im KI-Zeitalter nicht mehr – Produktverantwortliche diskutieren, welche Monetarisierungsmodelle stattdessen funktionieren.</li>\n  <li><strong>Stripe setzt auf internen KI-Einsatz:</strong> Owen Williams erläutert, wie ein internes KI-Tool die Produktentwicklung bei Stripe grundlegend transformiert hat.</li>\n  <li><strong>Agency statt Skills:</strong> Max Schoening, Head of Product bei Notion, argumentiert, dass Eigeninitiative und Handlungsfähigkeit im KI-Zeitalter wichtiger sind als das Erlernen einzelner Werkzeuge.</li>\n</ul>\n\n<hr>\n\n<h2>💹 Finanznachrichten</h2>\n\n<ul>\n  <li><strong>KI-Investitionen auf Rekordniveau:</strong> Big Tech hat in jüngster Zeit 725 Milliarden US-Dollar für KI ausgegeben – der freie Cashflow der Konzerne ist dadurch auf ein Zehnjahrestief gesunken.</li>\n  <li><strong>Anthropic-Bewertung nähert sich Billion-Dollar-Marke:</strong> Das KI-Unternehmen prüft Deals, die eine Bewertung von nahezu einer Billion US-Dollar implizieren würden – begleitet von stark steigenden Umsätzen.</li>\n  <li><strong>Trump-Familie mit Milliarden-Investmentvehikel:</strong> Die Söhne des US-Präsidenten unterstützen ein Vehikel in Höhe von einer Milliarde Dollar, das auf von Trump favorisierte Wirtschaftssektoren abzielt.</li>\n  <li><strong>KI in der Finanzbranche noch unbewiesen:</strong> Analysten und Marktteilnehmer mahnen zur Vorsicht – der konkrete Mehrwert von KI-Anwendungen im Finanzsektor ist noch nicht belegt.</li>\n  <li><strong>Geopolitik beeinflusst Märkte:</strong> Trumps Aussagen zu einem anhaltenden Waffenstillstand nach dem US-Iran-Konflikt sowie das Scheitern von „Project Freedom\" nach saudischem Rückzug sorgen für Unsicherheit an den Märkten.</li>\n</ul>\n\n<hr>\n\n<h2>🌍 Allgemeine Nachrichten</h2>\n\n<ul>\n  <li><strong>Ukraine-Krieg eskaliert weiter:</strong> Die Ukraine greift mehrere Ziele auf russischem Territorium an, darunter eine Ölanlage – die Frontlage bleibt nach vier Kriegsjahren hochdynamisch.</li>\n  <li><strong>Iran-Konflikt weitet sich aus:</strong> Die Vereinigten Arabischen Emirate melden die Abwehr iranischer Angriffe – der Konflikt droht sich regionalen auf weitere Nachbarstaaten auszuweiten.</li>\n  <li><strong>Schweizer Volksinitiative mit Patt:</strong> Die Abstimmung zur 10-Millionen-Schweiz-Initiative steht bei je 47 Prozent Ja und Nein – ein denkbar knappes Ergebnis mit weitreichenden gesellschaftspolitischen Folgen.</li>\n  <li><strong>Hantavirus auf Kreuzfahrtschiff:</strong> Britische Gesundheitsbehörden melden einen weiteren Verdachtsfall – die Lage wird aufmerksam beobachtet.</li>\n  <li><strong>Tuareg-Aufstand in Mali:</strong> Hintergründe zum anhaltenden Konflikt in der Sahelzone – zwischen Jihadismus-Vorwürfen und dem Selbstbild der Rebellen als „blaue Ritter der Wüste\".</li>\n</ul>\n\n<hr>\n\n<h2>🔭 Ausblick</h2>\n\n<p>Die kommenden Tage werden zeigen, ob die geopolitischen Spannungen im Nahen Osten und in der Ukraine eine weitere Eskalationsstufe erreichen. Parallel dürfte die Frage, wie nachhaltig die gigantischen KI-Investitionen der Tech-Konzerne sind, die Finanzmärkte und die Technologiebranche weiter beschäftigen.</p><details class=\"src-details\"><summary class=\"src-summary\"><span class=\"src-arrow\">▶</span>📰 Quellen &amp; Schlagzeilen (30 Artikel)</summary><div class=\"src-body\"><div class=\"src-category\"><div class=\"src-category-name\">Produktstrategie & Tech</div><div class=\"src-source\"><div class=\"src-source-name\">Lenny's Newsletter</div><div class=\"src-item\"><a href=\"https://www.lennysnewsletter.com/p/code-with-claude-the-5-biggest-updates\" target=\"_blank\" class=\"src-link\">Code with Claude: The 5 biggest updates explained</a><span class=\"src-date\">07.05.2026, 01:39</span></div><div class=\"src-item\"><a href=\"https://www.lennysnewsletter.com/p/quests-token-leaderboards-and-a-skills\" target=\"_blank\" class=\"src-link\">Quests, token leaderboards, and a skills marketplace: The elite AI adoption playbook | John Kim (Sendbird)</a><span class=\"src-date\">06.05.2026, 12:03</span></div><div class=\"src-item\"><a href=\"https://www.lennysnewsletter.com/p/why-saas-freemium-playbooks-dont\" target=\"_blank\" class=\"src-link\">Why SaaS freemium playbooks don’t work in AI, and what to do instead</a><span class=\"src-date\">05.05.2026, 13:03</span></div><div class=\"src-item\"><a href=\"https://www.lennysnewsletter.com/p/this-week-on-how-i-ai-the-internal\" target=\"_blank\" class=\"src-link\">🎙️ This week on How I AI: The internal AI tool that’s transforming how Stripe designs products</a pan>$60,074</span><span>$126,198</span></div><div class=\"mkt-track\"><div class=\"mkt-dot\" style=\"left:30.5%\"></div></div></td><td class=\"mkt-pct mkt-neg \">-9.57%</td><td class=\"mkt-pct mkt-pos \">+6.77%</td><td class=\"mkt-pct mkt-pos \">+2.01%</td></tr><tr><td class=\"mkt-name\"><span class=\"mkt-status mkt-status-open\" title=\"Markt geöffnet\">●</span><a href=\"https://finance.yahoo.com/quote/GC%3DF/\" target=\"_blank\" class=\"mkt-link\">Gold</a></td><td class=\"mkt-close\">$4,766.20</td><td class=\"mkt-pct mkt-pos\">+$84.30</td><td class=\"mkt-pct mkt-pos mkt-day\">+1.80%</td><td class=\"mkt-range\"><div class=\"mkt-range-labels\"><span>$3,125.00</span><span>$5,586.20</span></div><div class=\"mkt-track\"><div class=\"mkt-dot\" style=\"left:66.7%\"></div></div></td><td class=\"mkt-pct mkt-pos \">+10.47%</td><td class=\"mkt-pct mkt-pos \">+0.35%</td><td class=\"mkt-pct mkt-pos \">+3.28%</td></tr></tbody></table><div class=\"mkt-analysis\"><div class=\"mkt-analysis-title\">🔍 Marktbewegung &amp; Nachrichten</div><p>Der deutliche Rückgang des Ölpreises um fast 4% ist die plausibelste Bewegung des Tages und spiegelt direkt die gestrigen Meldungen über eine bevorstehende Iran-USA-Einigung wider, die eine Entspannung der Nahostlage und damit erhöhte Ölversorgungssicherheit signalisiert. Der Goldanstieg von 1,8% erscheint zunächst kontraintuitiv, da Gold typischerweise in geopolitischen Krisen steigt – in diesem Kontext könnte er jedoch auf verbleibende Unsicherheiten im Ukraine-Konflikt sowie auf allgemeine Inflations- und Währungssorgen hindeuten. Der DAX-Rückgang von 0,67% überrascht angesichts des gestrigen Anstiegs von über 2% und der anhaltend positiven Nachrichten aus dem Nahostfriedenprozess, lässt sich aber als technische Korrektur nach der starken Vortagesrally erklären. Die Divergenz zwischen DAX und US-Indizes – NASDAQ im Plus, S&amp;P 500 leicht positiv – ist plausibel, da die Big-Tech-Quartalsberichte von Microsoft, Apple, Amazon und Co. offenbar weiterhin Zuversicht in den US-Technologiesektor nähren, während Europa stärker von Gewinnmitnahmen betroffen ist. Der Bitcoin-Rückgang von knapp 1,5% fügt sich in das Bild ein, nachdem Michael Saylors möglicher Verkauf als Stimmungsdämpfer für den Kryptomarkt gewirkt haben dürfte.</p></div></div>\n\n<h1>📰 Tages-Briefing – 7. Mai 2026</h1>\n\n<p>Die Nachrichtenlage wird heute von zwei dominanten Themen geprägt: den sich abzeichnenden Fortschritten bei den US-iranischen Nuklearverhandlungen sowie einer anhaltenden KI-Transformation, die zunehmend auch Arbeitsplätze kostet. An den internationalen Kapitalmärkten herrscht vorsichtiger Optimismus, während innenpolitisch in Deutschland fiskalische Spannungen zunehmen.</p>\n\n<hr>\n\n<h2>💻 Produktstrategie & Technologie</h2>\n\n<ul>\n  <li><strong>KI-Tools dominieren die Produktagenda:</strong> Claude Code, GPT 5.5 und neue Bildgenerierungsmodelle stehen im Mittelpunkt intensiver Nutzertests und interner Unternehmensanwendungen – etwa bei Stripe, wo ein eigenes KI-Tool die Produktentwicklung grundlegend verändert.</li>\n  <li><strong>Big-Tech-Quartalsergebnisse im Fokus:</strong> Microsoft, Apple, Amazon, Google und Meta haben ihre Zahlen vorgelegt; Amazons strukturelle Wettbewerbsstärke und der KI-Chip-Arm Trainium rücken als langfristige Differenzierungsmerkmale in den Vordergrund.</li>\n  <li><strong>Intel unter Druck:</strong> Die Quartalsergebnisse werfen Fragen zur strategischen Positionierung auf – insbesondere, ob Intels Differenzierungsstrategie im KI-Hardware-Markt tragfähig ist.</li>\n  <li><strong>Neue Geschäftsmodelle durch KI:</strong> Klassische SaaS-Freemium-Strategien verlieren laut Lenny's Newsletter ihre Wirksamkeit; stattdessen gewinnen API-basierte und agentengesteuerte Monetarisierungsmodelle an Bedeutung.</li>\n  <li><strong>Agentur vor Skill-Vermittlung:</strong> Produktführer wie Max Schoening (Notion) argumentieren, dass in der KI-Ära die Förderung von Eigeninitiative wichtiger wird als das reine Erlernen technischer Fähigkeiten.</li>\n</ul>\n\n<hr>\n\n<h2>📈 Finanzen & Wirtschaft</h2>\n\n<ul>\n  <li><strong>Iran-Deal beflügelt Märkte:</strong> Hoffnungen auf ein befristetes US-iranisches Rahmenabkommen treiben Aktienmärkte in eine Rallybewegung – gleichzeitig fällt der Ölpreis wieder unter 100 US-Dollar, was Inflationssorgen etwas dämpft.</li>\n  <li><strong>DAX knapp unter 25.000 Punkten:</strong> Trotz der globalen Euphorie fällt der deutsche Leitindex leicht zurück; Händler bleiben in Wartestellung, bis konkrete Abkommensbedingungen vorliegen.</li>\n  <li><strong>Steuerschätzung belastet Koalition:</strong> Sinkende Steuereinnahmen erhöhen den Druck innerhalb der Bundesregierung – die SPD fordert höhere Abgaben für Gutverdiener, was Verteilungskonflikte neu entfacht.</li>\n  <li><strong>Stellenabbau in der Industrie:</strong> Continental streicht allein in Deutschland 1.600 Arbeitsplätze, Thyssenkrupp befindet sich laut Insidern im „Endspiel\" eines radikalen Umbaus – strukturelle Schwäche im deutschen Industriesektor setzt sich fort.</li>\n  <li><strong>KI-Unternehmen entlassen ebenfalls:</strong> DeepL, der europäische KI-Übersetzungsdienst, baut rund ein Viertel seiner Belegschaft ab – ein Zeichen, dass der Kostendruck auch in der KI-Branche selbst ankommt.</li>\n</ul>\n\n<hr>\n\n<h2>🌍 Allgemeine Nachrichten</h2>\n\n<ul>\n  <li><strong>Diplomatik im Vatikan:</strong> US-Außenminister Marco Rubio besucht Papst Leo XIV. und versucht, die durch frühere Spannungen mit dem Vatikan belasteten Beziehungen zu reparieren.</li>\n  <li><strong>Zwei frühere chinesische Verteidigungsminister zum Tode verurteilt:</strong> Wei Fenghe und Li Shangfu wurden in einem Korruptionsverfahren zum Tod verurteilt – ein seltenes, politisch hochsymbolisches Signal aus Peking.</li>\n  <li><strong>Ukraine-Krieg: Waffenruhe unter Beschuss:</strong> Kiew wirft Russland Verstöße gegen die vereinbarte Waffenruhe vor; die Lage bleibt instabil und diplomatische Fortschritte fragil.</li>\n  <li><strong>WHO bestätigt Hantavirus-Fälle an Bord eines Kreuzfahrtschiffs:</strong> Fünf Infektionen wurden offiziell gemeldet – globale Gesundheitsbehörden beobachten die Entwicklung aufmerksam.</li>\n  <li><strong>Bundeswehr-Fragebogen wird zur Pflicht:</strong> Wer den staatlichen Erfassungsbogen nicht ausfüllt, riskiert künftig ein Bußgeld von 250 Euro – die Maßnahme spiegelt die wachsende sicherheitspolitische Sensibilität in Deutschland wider.</li>\n</ul>\n\n<hr>\n\n<h2>🔭 Ausblick</h2>\n\n<p>Die weitere Entwicklung der US-Iran-Gespräche dürfte in den kommenden Tagen marktbewegende Wirkung entfalten – sowohl für Öl- als auch für Aktienpreise. Parallel wird die politische Debatte in Deutschland über Steuererhöhungen und den industriellen Strukturwandel an Schärfe gewinnen.</p><details class=\"src-details\"><summary class=\"src-summary\"><span class=\"src-arrow\">▶</span>📰 Quellen &amp; Schlagzeilen (59 Artikel)</summary><div class=\"src-body\"><div class=\"src-category\"><div class=\"src-category-name\">Produktstrategie & Tech</div><div class=\"src-source\"><div class=\"src-source-name\">Stratechery</div><div class=\"src-item\"><a href=\"https://stratechery.com/2026/an-interview-with-joanna-stern-about-living-with-ai/\" target=\"_blank\" class=\"src-link\">An Interview with Joanna Stern About Living With AI</a><span class=\"src-date\">07.05.2026, 10:00</span></div><div class=\"src-item\"><a href=\"https://stratechery.com/2026/microsoft-earnings-apple-earnings/\" target=\"_blank\" class=\"src-link\">Microsoft Earnings, Apple Earnings</a><span class=\"src-date\">06.05.2026, 10:00</span></div><div class=\"src-item\"><a href=\"https://stratechery.com/2026/amazons-durability/\" target=\"_blank\" class=\"src-link\">Amazon’s Durability</a><span class=\"src-date\">05.05.2026, 10:01</span></div><div class=\"src-item\"><a href=\"https://stratechery.com/2026/google-earnings-meta-earnings/\" target=\"_blank\" class=\"src-link\">Google Earnings, Meta Earnings</a><span cl ];
const _n = new Date();
const _doy = Math.floor((_n - new Date(_n.getFullYear(),0,0)) / 86400000);
const _q = QQ[_doy % QQ.length];
document.getElementById("qt").textContent = _q.t;
document.getElementById("qa").textContent = "— " + _q.a;

/* ── Date label ─────────────────────────────────────── */
const DAYS = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MONS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
document.getElementById("dlbl").textContent =
  DAYS[_n.getDay()] + ", " + _n.getDate() + ". " + MONS[_n.getMonth()] + " " + _n.getFullYear();
const todayStr = _n.toISOString().slice(0,10);

/* ── Theme ──────────────────────────────────────────── */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.getElementById("tico").textContent = t === "dark" ? "☀️" : "🌙";
  document.getElementById("tlbl").textContent = t === "dark" ? "Hell" : "Dark";
}
function toggleTheme() {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem("theme", t); applyTheme(t);
}
applyTheme(localStorage.getItem("theme") ||
  (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

/* ── Category detection ─────────────────────────────── */
function catOf(txt) {
  const t = txt.toLowerCase();
  if (/finanz|wirtschaft|markt|börse|konjunktur|handel/.test(t)) return "finance";
  if (/politik|geopolit|sicherheit|außenpolitik|nachrichten|ausblick/.test(t)) return "politics";
  if (/tech|künstlich| ki |produkt|digital|startup/.test(t)) return "tech";
  return "other";
}
const CAT_MAP = {finance:"fin",politics:"pol",tech:"tec"};
const CAT_LBL = {finance:"Finanzen",politics:"Politik",tech:"Tech"};

function wrapSections(card) {
  const nodes = Array.from(card.childNodes);
  let sec = null;
  const frag = document.createDocumentFragment();
  for (const node of nodes) {
    const isH2 = node.nodeType === 1 && node.tagName === "H2";
    if (isH2) {
      const cat = catOf(node.textContent);
      sec = document.createElement("div");
      sec.className = "cs";
      sec.dataset.cat = cat;
      if (CAT_MAP[cat]) {
        const tag = document.createElement("span");
        tag.className = "stag " + CAT_MAP[cat];
        tag.textContent = CAT_LBL[cat];
        node.appendChild(tag);
      }
      frag.appendChild(sec);
    }
    (sec || frag).appendChild(node);
  }
  card.appendChild(frag);
}

/* ── Filter ─────────────────────────────────────────── */
let curFilter = "all";
function setFilter(cat) {
  curFilter = cat;
  document.querySelectorAll(".fbtn").forEach(b => b.classList.toggle("on", b.dataset.cat === cat));
  document.querySelectorAll(".cs").forEach(s =>
    s.classList.toggle("off", cat !== "all" && s.dataset.cat !== cat));
}

/* ── Show briefing ──────────────────────────────────── */
function show(id) {
  const b = briefings.find(x => x.id === id);
  if (!b) return;
  const view = document.getElementById("bview");
  view.innerHTML = '<div class="bc" id="bc">' + b.html + '</div>';
  wrapSections(document.getElementById("bc"));
  setFilter(curFilter);
  document.querySelectorAll(".arc-card").forEach(c => c.classList.toggle("on", c.dataset.id === id));
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ── Archive grid ───────────────────────────────────── */
const grid = document.getElementById("agrid");
briefings.forEach(b => {
  const c = document.createElement("div");
  c.className = "arc-card";
  c.dataset.id = b.id;
  c.innerHTML =
    '<div class="arc-wd">' + b.weekday + '</div>' +
    '<div class="arc-dt">' + b.date_display +
      (b.date === todayStr ? '<span class="today-pill">Heute</span>' : '') + '</div>' +
    '<div class="arc-pre">' + (b.preview || "") + '</div>';
  c.addEventListener("click", () => show(b.id));
  grid.appendChild(c);
});

if (briefings.length) show(briefings[0].id);

/* ── Stock Research ─────────────────────────────────── */
const STK = 'http://localhost:5001';
const _inp = document.getElementById('stk-inp');
const _sug = document.getElementById('stk-sug');
const _res = document.getElementById('stk-res');
let _st = null, _hi = -1;

_inp.addEventListener('input', () => {
  clearTimeout(_st);
  const q = _inp.value.trim();
  if (q.length < 2) { _hideSug(); return; }
  _st = setTimeout(() => _doSearch(q), 280);
});

_inp.addEventListener('keydown', e => {
  const items = _sug.querySelectorAll('.stk-sug-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); _nav(items, 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); _nav(items, -1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (_hi >= 0 && items[_hi]) items[_hi].click();
    else { _hideSug(); const q = _inp.value.trim().toUpperCase(); if (q) _loadStock(q); }
  }
  else if (e.key === 'Escape') _hideSug();
});

document.addEventListener('click', e => { if (!e.target.closest('#stk-sec')) _hideSug(); });

function _nav(items, dir) {
  if (!items.length) return;
  if (_hi >= 0) items[_hi].classList.remove('hi');
  _hi = Math.max(0, Math.min(items.length - 1, _hi + dir));
  items[_hi].classList.add('hi');
  items[_hi].scrollIntoView({block:'nearest'});
}

async function _doSearch(q) {
  try {
    const r = await fetch(`${STK}/api/search?q=${encodeURIComponent(q)}`);
    if (!r.ok) throw new Error();
    const data = await r.json();
    if (!Array.isArray(data) || !data.length) { _hideSug(); return; }
    _hi = -1;
    _sug.innerHTML = data.map(s =>
      `<div class="stk-sug-item" onclick="_pick(${JSON.stringify(s.symbol)})">` +
      `<span class="sug-sym">${_e(s.symbol)}</span>` +
      `<span class="sug-nm">${_e(s.name)}</span>` +
      `<span class="sug-ex">${_e(s.exchange||'')}</span></div>`
    ).join('');
    _sug.style.display = 'block';
  } catch { _hideSug(); }
}

function _pick(sym) { _inp.value = sym; _hideSug(); _loadStock(sym); }
function _hideSug() { _sug.style.display = 'none'; _hi = -1; }
function _e(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function _fmt(n, d=2) {
  if (n == null || isNaN(n)) return '—';
  if (Math.abs(n) >= 1e12) return (n/1e12).toFixed(2) + ' Bio.';
  if (Math.abs(n) >= 1e9)  return (n/1e9).toFixed(2)  + ' Mrd.';
  if (Math.abs(n) >= 1e6)  return (n/1e6).toFixed(1)  + ' Mio.';
  return n.toLocaleString('de-DE', {maximumFractionDigits: d});
}
function _vol(n) {
  if (n == null || isNaN(n)) return '—';
  if (n >= 1e9) return (n/1e9).toFixed(2) + 'Mrd';
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'Mio';
  if (n >= 1e3) return Math.round(n/1e3) + 'k';
  return String(n);
}

async function _loadStock(sym) {
  _res.style.display = 'block';
  _res.innerHTML = `<div class="stk-ov"><div style="display:flex;align-items:center;gap:10px;padding:12px 0">` +
    `<div class="spin"></div><span style="color:var(--mu);font-size:14px">Lade ${_e(sym)}…</span></div></div>`;
  document.getElementById('stk-sec').scrollIntoView({behavior:'smooth', block:'nearest'});

  try {
    const [ir, hr] = await Promise.all([
      fetch(`${STK}/api/stock/${sym}`),
      fetch(`${STK}/api/stock/${sym}/history`),
    ]);
    const info = await ir.json();
    const hist = await hr.json();
    if (info.error) throw new Error(info.error);

    const up = (info.change ?? 0) >= 0;
    const cc = up ? 'stk-up' : 'stk-dn';
    const cs = up ? '+' : '';

    // 52-week dot position
    const lo = info.week52_low, hi52 = info.week52_high, pr = info.price;
    const dot = (lo && hi52 && hi52 > lo)
      ? Math.max(0, Math.min(100, (pr - lo) / (hi52 - lo) * 100)).toFixed(1) : '50';

    const ov =
      `<div class="stk-ov">` +
      `<div class="stk-co">` +
      `<strong>${_e(info.name)}</strong>` +
      `<span style="opacity:.35">·</span><span>${_e(info.symbol)}</span>` +
      `<span style="opacity:.35">·</span><span>${_e(info.currency||'USD')}</span>` +
      (info.sector ? `<span class="stk-sector">${_e(info.sector)}</span>` : '') +
      `</div>` +
      `<div class="stk-pr-row">` +
      `<span class="stk-pr">${info.price?.toFixed(2) ?? '—'}</span>` +
      `<span class="stk-ch ${cc}">${cs}${info.change?.toFixed(2) ?? '—'}&ensp;(${cs}${info.change_pct?.toFixed(2) ?? '—'}%)</span>` +
      `</div>` +
      `<div class="stk-mets">` +
      `<div class="stk-met"><div class="stk-ml">Marktkapital.</div><div class="stk-mv">${_fmt(info.market_cap)}</div></div>` +
      `<div class="stk-met"><div class="stk-ml">KGV (P/E)</div><div class="stk-mv">${info.pe_ratio ? info.pe_ratio.toFixed(1) : '—'}</div></div>` +
      `<div class="stk-met"><div class="stk-ml">52W Hoch / Tief</div>` +
        `<div class="stk-mv">${info.week52_high?.toFixed(2) ?? '—'} / ${info.week52_low?.toFixed(2) ?? '—'}</div>` +
        `<div class="w52-bar"><div class="w52-dot" style="left:${dot}%"></div></div></div>` +
      `<div class="stk-met"><div class="stk-ml">Volumen</div><div class="stk-mv">${_vol(info.volume)}</div></div>` +
      `<div class="stk-met"><div class="stk-ml">Ø Volumen</div><div class="stk-mv">${_vol(info.avg_volume)}</div></div>` +
      (info.industry ? `<div class="stk-met"><div class="stk-ml">Branche</div><div class="stk-mv" style="font-size:13px">${_e(info.industry)}</div></div>` : '') +
      `</div></div>`;

    const ch = Array.isArray(hist) && hist.length > 1
      ? `<div class="stk-ch-card"><div class="stk-ch-ttl">Kursverlauf — 30 Tage</div>${_chart(hist, up)}</div>`
      : '';

    const ai =
      `<div class="stk-ai" id="stk-ai-box">` +
      `<div class="ai-ttl">KI-Analyse</div>` +
      `<div class="ai-spin"><div class="spin"></div>Analysiere ${_e(info.name)}…</div>` +
      `</div>`;

    _res.innerHTML = ov + ch + ai;
    _loadAI(sym);

  } catch(e) {
    _res.innerHTML =
      `<div class="stk-ov" style="text-align:center;padding:36px">` +
      `<div style="font-size:28px;margin-bottom:10px">⚠️</div>` +
      `<div style="color:var(--rd);margin-bottom:8px;font-weight:600">${_e(e.message)}</div>` +
      `<div style="font-size:13px;color:var(--mu)">Läuft der Flask-Server?&ensp;` +
      `<code style="background:var(--sf2);padding:2px 6px;border-radius:5px">python app.py</code></div></div>`;
  }
}

async function _loadAI(sym) {
  try {
    const r = await fetch(`${STK}/api/stock/${sym}/summary`);
    const d = await r.json();
    const box = document.getElementById('stk-ai-box');
    if (!box) return;
    box.innerHTML = `<div class="ai-ttl">KI-Analyse</div>` +
      (d.error
        ? `<div style="color:var(--mu);font-size:13px">${_e(d.error)}</div>`
        : `<div class="ai-body">${_e(d.summary)}</div>`);
  } catch {
    const box = document.getElementById('stk-ai-box');
    if (box) box.innerHTML = `<div class="ai-ttl">KI-Analyse</div><div style="color:var(--mu);font-size:13px">Nicht verfügbar</div>`;
  }
}

function _chart(data, isUp) {
  const prices = data.map(d => d.close);
  const min = Math.min(...prices), max = Math.max(...prices);
  const rng = (max - min) || max * 0.005 || 1;
  const col = isUp ? 'var(--gn)' : 'var(--rd)';
  const W=660, H=150, pL=54, pR=10, pT=8, pB=26;
  const cw = W-pL-pR, ch = H-pT-pB, n = data.length;
  const px = i => pL + (i/(n-1))*cw;
  const py = v => pT + ch - ((v-min)/rng)*ch;

  const line = data.map((d,i) => `${i?'L':'M'}${px(i).toFixed(1)},${py(d.close).toFixed(1)}`).join('');
  const area = `${line} L${px(n-1).toFixed(1)},${(pT+ch).toFixed(1)} L${pL},${(pT+ch).toFixed(1)} Z`;
  const gid  = 'g' + Math.random().toString(36).slice(2,8);

  let grid='', yl='';
  for (let i=0; i<=4; i++) {
    const v=min+rng*i/4, yy=py(v).toFixed(1);
    grid += `<line x1="${pL}" y1="${yy}" x2="${W-pR}" y2="${yy}" stroke="var(--bd)" stroke-width="1" stroke-dasharray="3,3"/>`;
    yl   += `<text x="${pL-5}" y="${(+yy+4).toFixed(1)}" text-anchor="end" class="chart-lbl">${v.toFixed(2)}</text>`;
  }
  let xl='';
  [0,.25,.5,.75,1].forEach(f => {
    const i = Math.min(n-1, Math.round(f*(n-1)));
    xl += `<text x="${px(i).toFixed(1)}" y="${H-5}" text-anchor="middle" class="chart-lbl">${data[i].date.slice(5)}</text>`;
  });
  const lx=px(n-1).toFixed(1), ly=py(prices[n-1]).toFixed(1);

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;overflow:visible">` +
    `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">` +
    `<stop offset="0%" stop-color="${col}" stop-opacity=".18"/>` +
    `<stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>` +
    `${grid}` +
    `<path d="${area}" fill="url(#${gid})"/>` +
    `<path d="${line}" style="stroke:${col}" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>` +
    `<circle cx="${lx}" cy="${ly}" r="4" style="fill:${col}" stroke="var(--sf)" stroke-width="2"/>` +
    `${yl}${xl}</svg>`;
}
</script>
